<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Student Task Manager{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav><span class="brand">📚 Student Task Manager</span>
<a href="{{ url_for('dashboard') }}">Dashboard</a>
<a href="{{ url_for('tasks') }}">Tasks</a>
<a href="{{ url_for('add_task') }}">Add Task</a>
<a href="{{ url_for('subjects') }}">Subjects</a></nav>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></body></html>
